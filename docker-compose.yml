# Despliegue de UCI Analytics: API de predicción + tablero.
# Uso (en la máquina EC2, desde la raíz del repositorio, después de `dvc pull`):
#   docker compose up -d --build
services:
  api:
    build: ./api
    image: uci-api:1.0.0
    container_name: uci-api
    ports:
      - "8001:8001"
    restart: unless-stopped

  tablero:
    build:
      context: .
      dockerfile: tablero/Dockerfile
    image: uci-tablero:1.0.0
    container_name: uci-tablero
    environment:
      - API_URL=http://api:8001
    ports:
      - "8050:8050"
    depends_on:
      - api
    restart: unless-stopped
